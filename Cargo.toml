[package]
name = "fast_decimal"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A fast fixed-scale decimal for Rust"
readme = "README.md"
repository = "https://github.com/liumuqing/fast_decimal"
categories = ["data-structures", "mathematics"]
keywords = ["decimal", "fixed-point", "numeric", "arithmetic"]
rust-version = "1.82"

[workspace]
members = ["macros"]

[lib]
name = "fast_decimal"
path = "src/lib.rs"

[dependencies]
portable-atomic = { version = "1", optional = true }
crypto-bigint = { version = "0.7.4", default-features = false }
fast_decimal_macros = { version = "0.1.0", path = "macros", optional = true }
nohash-hasher = { version = "0.2", optional = true }
serde = { version = "1", optional = true }

[dev-dependencies]
fast_decimal_macros = { version = "0.1.0", path = "macros" }
serde_json = "1"
trybuild = "1"

[features]
default = []
atomic = ["dep:portable-atomic"]
macros = ["dep:fast_decimal_macros"]
nohash-hasher = ["dep:nohash-hasher"]
serde = ["dep:serde"]
